<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SDG 11 | Feedback</title>

    <link rel="stylesheet" href="style5css.css">

</head>


<body>

    <div class="form-page">

        <div class="form-box">

            <div class="form-icon">
                💬
            </div>

            <small>SDG 11 COMMUNITY</small>

            <h1>Share Your Feedback</h1>

            <p>
                Your feedback can help us improve our
                sustainable cities project.
            </p>


            <form>

                <label>Name</label>

                <input
                    type="text"
                    placeholder="Enter your name"
                    required
                >


                <label>Email ID</label>

                <input
                    type="email"
                    placeholder="Enter your email"
                    required
                >


                <label>Your Feedback</label>

                <textarea
                    rows="6"
                    placeholder="Write your feedback here..."
                    required></textarea>


                <button type="submit">
                    Submit Feedback →
                </button>

            </form>


            <a href="index2.html" class="back-link">
                ← Back to SDG 11
            </a>

        </div>

    </div>

</body>

</html>
