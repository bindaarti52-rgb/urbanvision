<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SDG 11 | Join Us</title>

    <link rel="stylesheet" href="style4css.css">

</head>


<body>

    <div class="form-page">

        <div class="form-box">

            <div class="form-icon">
                🌱
            </div>

            <small>SDG 11 COMMUNITY</small>

            <h1>Join Us</h1>

            <p>
                Become a part of the movement for
                better and sustainable cities.
            </p>


            <form>


                <!-- NAME -->

                <label>Name</label>

                <input
                    type="text"
                    placeholder="Enter your full name"
                    required
                >


                <!-- EMAIL -->

                <label>Email ID</label>

                <input
                    type="email"
                    placeholder="Enter your email address"
                    required
                >


                <!-- AGE -->

                <label>Age</label>

                <input
                    type="number"
                    placeholder="Enter your age"
                    min="1"
                    max="100"
                    required
                >


                <!-- GENDER -->

                <label>Gender</label>

                <div class="gender">

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="male"
                        >
                        Male
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="female"
                        >
                        Female
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="other"
                        >
                        Other
                    </label>

                </div>


                <!-- ADDRESS -->

                <label>Address</label>

                <textarea
                    rows="3"
                    placeholder="Enter your address"
                    required></textarea>


                <!-- CONTACT -->

                <label>Contact Number</label>

                <input
                    type="tel"
                    placeholder="Enter your contact number"
                    required
                >


                <!-- SUBMIT -->

                <button type="submit">
                    Join the Movement →
                </button>


            </form>


            <a href="index2.html" class="back-link">
                ← Back to SDG 11
            </a>

        </div>

    </div>

</body>

</html>
